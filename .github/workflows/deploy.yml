name: Release ResearchHub pair
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [plan, rehearse, release, rollback, cache-audit, cache-maintain]
        default: plan
      release_tag:
        description: Exact pair tag (rollback or cache maintenance)
        type: string
      manifest_sha256:
        description: Exact historical manifest SHA256 (rollback only)
        type: string
      control_sha256:
        description: Exact control SHA of the current pair (cache maintenance only)
        type: string
      confirm:
        description: Type ROLLBACK for paired rollback
        type: string
permissions:
  contents: read
concurrency:
  group: researchhub-ecs-release
  cancel-in-progress: false
jobs:
  release:
    if: inputs.mode != 'cache-audit' && inputs.mode != 'cache-maintain'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: production
    env:
      MODE: ${{ inputs.mode || 'release' }}
      OSS_ACCESS_KEY: ${{ secrets.OSS_ACCESS_KEY }}
      OSS_SECRET_KEY: ${{ secrets.OSS_SECRET_KEY }}
      OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
      OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
      HUB_CORE_SOURCE_BUCKET: ${{ vars.HUB_CORE_SOURCE_BUCKET }}
      HUB_TENANT_SLUG: ${{ vars.VITE_AUTH_TENANT_SLUG }}
      HUB_DATABASE_APPROVED_DIGEST: ${{ vars.HUB_DATABASE_APPROVED_DIGEST }}
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
      DOCKER_BUILD_SUMMARY: 'false'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate inputs and release controls
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          test "$MODE" != rollback || test "$CONFIRM" = ROLLBACK
          python3 - <<'PY'
          import json,os,re
          import importlib.util
          s=importlib.util.spec_from_file_location('plan','scripts/hub-release-plan.py');plan=importlib.util.module_from_spec(s);s.loader.exec_module(plan)
          p=json.load(open('deploy/release-policy.json'));assert os.environ['HUB_TENANT_SLUG']==p['tenantSlug'];assert os.environ['RUNNER_ARCH']=='X64'
          for k in ('OSS_ACCESS_KEY','OSS_SECRET_KEY','OSS_BUCKET','OSS_ENDPOINT','HUB_CORE_SOURCE_BUCKET'):assert os.environ.get(k)
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('HUB_RELEASE_TAG='+plan.release_tag(os.environ['GITHUB_SHA'],os.environ['GITHUB_RUN_ID'],os.environ['GITHUB_RUN_ATTEMPT'])+'\n')
          PY
          python3 scripts/hub-release-plan.test.py
          python3 scripts/hub-release.test.py
          python3 scripts/hub-release-pair.test.py
          python3 tests/p002-frontend-release.test.py
          python3 scripts/hub-runtime-command.test.py
          python3 scripts/hub-release-workflow.test.py
          python3 scripts/hub-runtime-bootstrap.test.py
          python3 scripts/hub-release-retention.test.py
          python3 scripts/hub-runtime-artifacts.test.py
          python3 scripts/hub-runtime-server.test.py
          python3 scripts/hub-frontend-rollback.test.py
          node --test deploy/backend-package.test.mjs server/api-proxy.test.mjs server/static.test.mjs
          bash -n scripts/run-hub-runtime-command.sh
      - name: Install existing OSS SDK
        run: python3 -m pip install 'oss2==2.19.1'
      - name: Plan from the last successful pair
        id: prepare
        env:
          TARGET_TAG: ${{ inputs.release_tag }}
          TARGET_SHA: ${{ inputs.manifest_sha256 }}
        run: >-
          python3 scripts/hub-release.py prepare --directory "$RUNNER_TEMP/hub-release"
          --mode "$MODE" --tag "$TARGET_TAG" --manifest-sha "$TARGET_SHA"
      - name: Refresh current Git Hub source with the immutable private core
        if: steps.prepare.outputs.backend == 'true' && env.MODE != 'plan'
        run: |
          node --input-type=module - <<'JS'
          import{refreshBackendHub}from'./deploy/backend-package.mjs';
          import{upgradeFrozenKnowledgeCore}from'./deploy/knowledge-chat-kb-upgrade.mjs';
          import{upgradeFrozenPrivateMaterialCore}from'./deploy/private-material-core-upgrade.mjs';
          import{upgradeFrozenArticleCore}from'./deploy/article-chat-core-upgrade.mjs';
          import{readFileSync}from'node:fs';
          const policy=JSON.parse(readFileSync('deploy/release-policy.json'));
          const context=process.env.RUNNER_TEMP+'/hub-backend-context';
          if(policy.coreUpgrade){const upgraded=upgradeFrozenKnowledgeCore({source:process.env.RUNNER_TEMP+'/hub-backend-baseline',output:policy.articleCoreUpgrade?process.env.RUNNER_TEMP+'/hub-backend-knowledge':context});if(upgraded.coreDigest!==policy.coreUpgrade.targetCoreDigest)throw Error('KB_CORE_UPGRADE_DIGEST_REAPPROVAL_REQUIRED');}
          if(policy.articleCoreUpgrade){const upgraded=upgradeFrozenArticleCore({source:process.env.RUNNER_TEMP+'/hub-backend-knowledge',output:policy.privateCoreUpgrade?process.env.RUNNER_TEMP+'/hub-backend-article':context});if(upgraded.coreDigest!==(policy.privateCoreUpgrade?.sourceCoreDigest??policy.coreDigest))throw Error('ARTICLE_CORE_UPGRADE_DIGEST_REAPPROVAL_REQUIRED');}
          if(policy.privateCoreUpgrade){const upgraded=upgradeFrozenPrivateMaterialCore({source:process.env.RUNNER_TEMP+'/hub-backend-article',output:context});if(upgraded.coreDigest!==policy.coreDigest)throw Error('PRIVATE_CORE_UPGRADE_DIGEST_CHANGED');}
          const r=refreshBackendHub({context:process.env.RUNNER_TEMP+'/hub-backend-context',source:process.cwd(),sourceGit:process.env.GITHUB_SHA});
          console.log(JSON.stringify({coreDigest:r.coreDigest,hubDigest:r.hubDigest,sourceGit:r.sourceGit}));
          JS
      - uses: docker/setup-buildx-action@v3
        if: steps.prepare.outputs.release_required == 'true' && env.MODE != 'plan' && env.MODE != 'rollback'
      - name: Build changed backend
        if: steps.prepare.outputs.backend == 'true' && env.MODE != 'plan'
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/hub-backend-context
          file: ${{ runner.temp }}/hub-backend-context/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: researchhub-backend:${{ env.HUB_RELEASE_TAG }}
          build-args: |
            CORE_MANIFEST_SHA256=${{ steps.prepare.outputs.core_digest }}
            HUB_SOURCE_SHA=${{ github.sha }}
      - name: Reuse unchanged backend
        if: steps.prepare.outputs.backend == 'false' && steps.prepare.outputs.release_required == 'true' && env.MODE != 'plan'
        run: python3 scripts/hub-release.py reuse --directory "$RUNNER_TEMP/hub-release" --component backend
      - name: Build changed frontend
        if: steps.prepare.outputs.frontend == 'true' && env.MODE != 'plan'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ghcr.io/pengxiaochuan-ai/pengxc-researchhub:${{ env.HUB_RELEASE_TAG }}
          build-args: |
            VITE_AUTH_TENANT_SLUG=${{ env.HUB_TENANT_SLUG }}
            HUB_SOURCE_SHA=${{ github.sha }}
          cache-from: type=gha,scope=researchhub-runtime-frontend
          cache-to: type=gha,mode=max,scope=researchhub-runtime-frontend
      - name: Reuse unchanged frontend
        if: steps.prepare.outputs.frontend == 'false' && steps.prepare.outputs.release_required == 'true' && env.MODE != 'plan'
        run: python3 scripts/hub-release.py reuse --directory "$RUNNER_TEMP/hub-release" --component frontend
      - name: Seal and upload a single pair manifest
        id: artifacts
        if: steps.prepare.outputs.release_required == 'true' && env.MODE != 'plan' && env.MODE != 'rollback'
        run: |
          docker run --rm --network none --entrypoint node "${{ steps.prepare.outputs.backend_image }}" -e "if(process.arch!=='x64')process.exit(1)"
          if test "${{ steps.prepare.outputs.backend }}" = true; then
            docker run --rm --network none --entrypoint node "${{ steps.prepare.outputs.backend_image }}" -e "const r=require('/opt/researchhub/release.json');if(r.sourceGit!==process.argv[1])process.exit(1)" "$GITHUB_SHA"
          fi
          docker run --rm --network none --entrypoint node "ghcr.io/pengxiaochuan-ai/pengxc-researchhub:$HUB_RELEASE_TAG" -e "const fs=require('fs');if(!fs.readdirSync('/app/dist/assets').filter(n=>n.endsWith('.js')).some(n=>fs.readFileSync('/app/dist/assets/'+n,'utf8').includes(process.argv[1])))process.exit(1)" "$HUB_TENANT_SLUG"
          if test "${{ steps.prepare.outputs.backend }}" = true; then
            docker save "${{ steps.prepare.outputs.backend_image }}" | gzip > "$RUNNER_TEMP/hub-release/backend-image.tar.gz"
          else
            cp "$RUNNER_TEMP/hub-release/previous-backend-image.tar.gz" "$RUNNER_TEMP/hub-release/backend-image.tar.gz"
          fi
          docker save "ghcr.io/pengxiaochuan-ai/pengxc-researchhub:$HUB_RELEASE_TAG" | gzip > "$RUNNER_TEMP/hub-release/researchhub.tar.gz"
          python3 scripts/hub-release.py collect --directory "$RUNNER_TEMP/hub-release"
          python3 scripts/hub-runtime-artifacts.py upload --directory "$RUNNER_TEMP/hub-release" --tag "$HUB_RELEASE_TAG"
      - name: Verify real unchanged component reuse and source provenance
        if: steps.artifacts.outcome == 'success'
        run: python3 scripts/hub-release-reuse-rehearsal.py
      - name: Real isolated Docker and PostgreSQL upgrade and rollback rehearsal
        id: explicit_rehearsal
        if: steps.artifacts.outcome == 'success' && env.MODE == 'rehearse'
        env:
          HUB_FIXTURE_NODE_IMAGE: ${{ steps.prepare.outputs.backend_image }}
          HUB_REHEARSAL_OUTPUT: ${{ runner.temp }}/hub-rehearsal
        run: python3 scripts/hub-release-rehearsal.py
      - uses: actions/upload-artifact@v4
        if: always() && steps.explicit_rehearsal.outcome == 'success'
        with:
          name: synthetic-release-rehearsal
          path: ${{ runner.temp }}/hub-rehearsal/*.json
          retention-days: 7
      - name: Bind paired controls to the exact manifest
        id: control
        if: steps.prepare.outputs.release_required == 'true' && env.MODE != 'plan'
        env:
          TARGET_TAG: ${{ steps.artifacts.outputs.tag || steps.prepare.outputs.tag }}
          TARGET_SHA: ${{ steps.artifacts.outputs.manifest_sha || steps.prepare.outputs.manifest_sha }}
        run: |
          echo "HUB_RUNTIME_TAG=$TARGET_TAG" >> "$GITHUB_ENV"
          python3 scripts/hub-runtime-controls.py --tag "$TARGET_TAG" --manifest-sha "$TARGET_SHA" --previous "$RUNNER_TEMP/hub-release/previous-release.json"
      - name: Apply both components with paired rollback
        id: apply
        if: steps.control.outcome == 'success' && (env.MODE == 'release' || env.MODE == 'rollback')
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
          ALIYUN_ECS_INSTANCE_ID: ${{ secrets.ALIYUN_ECS_INSTANCE_ID }}
          HUB_RUNTIME_CONTROL_SHA256: ${{ steps.control.outputs.control_sha }}
          HUB_RUNTIME_ACTION: pair-release
        run: bash scripts/run-hub-runtime-command.sh
      - name: Read-only real browser smoke
        id: browser
        if: steps.apply.outcome == 'success'
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" --ignore-scripts 'playwright@1.63.0'
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
          HUB_PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser/node_modules/playwright/index.mjs" HUB_SMOKE_OUTPUT="$RUNNER_TEMP/hub-browser" node scripts/hub-release-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always() && steps.apply.outcome == 'success'
        with:
          name: public-browser-smoke
          path: ${{ runner.temp }}/hub-browser
          retention-days: 7
      - name: Finalize the successful pair after browser verification
        id: finalize
        if: success() && steps.browser.outcome == 'success'
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
          ALIYUN_ECS_INSTANCE_ID: ${{ secrets.ALIYUN_ECS_INSTANCE_ID }}
          HUB_RUNTIME_CONTROL_SHA256: ${{ steps.control.outputs.control_sha }}
          HUB_RUNTIME_ACTION: pair-finalize
        run: bash scripts/run-hub-runtime-command.sh
      - name: Restore both previous components if browser verification fails
        if: always() && (failure() || cancelled()) && steps.apply.outcome == 'success' && steps.finalize.outcome == 'skipped'
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
          ALIYUN_ECS_INSTANCE_ID: ${{ secrets.ALIYUN_ECS_INSTANCE_ID }}
          HUB_RUNTIME_CONTROL_SHA256: ${{ steps.control.outputs.control_sha }}
          HUB_RUNTIME_ACTION: pair-rollback
        run: bash scripts/run-hub-runtime-command.sh
      - name: Maintain the ResearchHub release cache
        if: success() && steps.finalize.outcome == 'success'
        continue-on-error: true
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
          ALIYUN_ECS_INSTANCE_ID: ${{ secrets.ALIYUN_ECS_INSTANCE_ID }}
          HUB_RUNTIME_CONTROL_SHA256: ${{ steps.control.outputs.control_sha }}
          HUB_RUNTIME_ACTION: pair-cache-maintain
        run: bash scripts/run-hub-runtime-command.sh

  cache:
    if: inputs.mode == 'cache-audit' || inputs.mode == 'cache-maintain'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Check current ResearchHub cache
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
          ALIYUN_ECS_INSTANCE_ID: ${{ secrets.ALIYUN_ECS_INSTANCE_ID }}
          HUB_RUNTIME_TAG: ${{ inputs.release_tag }}
          HUB_RUNTIME_CONTROL_SHA256: ${{ inputs.control_sha256 }}
          HUB_RUNTIME_ACTION: ${{ format('pair-{0}', inputs.mode) }}
        run: bash scripts/run-hub-runtime-command.sh
