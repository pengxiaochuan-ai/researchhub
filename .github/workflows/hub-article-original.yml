name: Restore one approved Hub original
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: researchhub-ecs-release
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the approved private temporary payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download hub-article-original-transfer-20261120 --pattern original.zlib --dir "$RUNNER_TEMP/article-original"
      - name: Transfer exactly one original to existing Hub OSS
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
          ALIYUN_ECS_INSTANCE_ID: ${{ secrets.ALIYUN_ECS_INSTANCE_ID }}
        shell: bash
        run: |
          set -Eeuo pipefail
          export ALIBABA_CLOUD_IGNORE_PROFILE=TRUE
          d="$(mktemp -d)"
          trap 'rm -rf -- "$d" "$RUNNER_TEMP/article-original"' EXIT
          curl -fsSL --connect-timeout 15 --max-time 90 https://github.com/aliyun/aliyun-cli/releases/download/v3.3.18/aliyun-cli-linux-3.3.18-amd64.tgz -o "$d/cli.tgz"
          printf '%s  %s\n' 0823286604dbd8beb8d65dd0694d23c913e7c5d5a02b20a3593a4f8a6517f1d4 "$d/cli.tgz" | sha256sum -c -
          tar -xzf "$d/cli.tgz" -C "$d" aliyun
          python3 scripts/hub-article-original-transfer.py "$d/aliyun" "$RUNNER_TEMP/article-original/original.zlib"
