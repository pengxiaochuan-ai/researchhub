name: Restore one approved Hub original
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Write only the approved original after checks
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: researchhub-ecs-release
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Decode the encrypted one-object transport payload
        env:
          ORIGINAL_PAYLOAD: ${{ secrets.HUB_APPROVED_ORIGINAL_20261120 }}
        run: |
          python3 - <<'PY_PAYLOAD'
          import base64,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'article-original';root.mkdir(mode=0o700)
          payload=base64.b64decode(os.environ['ORIGINAL_PAYLOAD'],validate=True)
          p=root/'original.zlib';p.write_bytes(payload);p.chmod(0o600)
          PY_PAYLOAD
      - name: Verify payload and bounded commands without cloud access
        env:
          ARTICLE_TRANSFER_DRY_RUN: 'true'
        run: python3 scripts/hub-article-original-transfer.py ignored "$RUNNER_TEMP/article-original/original.zlib"
      - name: Transfer exactly one original to existing Hub OSS
        if: inputs.apply
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
          ALIYUN_ECS_INSTANCE_ID: ${{ secrets.ALIYUN_ECS_INSTANCE_ID }}
        shell: bash
        run: |
          set -Eeuo pipefail
          export ALIBABA_CLOUD_IGNORE_PROFILE=TRUE
          d="$(mktemp -d)"
          trap 'rm -rf -- "$d" "$RUNNER_TEMP/article-original"' EXIT
          curl -fsSL --connect-timeout 15 --max-time 90 https://github.com/aliyun/aliyun-cli/releases/download/v3.3.18/aliyun-cli-linux-3.3.18-amd64.tgz -o "$d/cli.tgz"
          printf '%s  %s\n' 0823286604dbd8beb8d65dd0694d23c913e7c5d5a02b20a3593a4f8a6517f1d4 "$d/cli.tgz" | sha256sum -c -
          tar -xzf "$d/cli.tgz" -C "$d" aliyun
          python3 scripts/hub-article-original-transfer.py "$d/aliyun" "$RUNNER_TEMP/article-original/original.zlib"
