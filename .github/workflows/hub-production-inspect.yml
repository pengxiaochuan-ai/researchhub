name: Restore fourteen approved Hub originals
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Restore only the fourteen approved existing originals
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: researchhub-ecs-release
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble encrypted temporary original data
        env:
          PART_00: ${{ secrets.HUB_APPROVED_ORIGINALS_20261120_00 }}
          PART_01: ${{ secrets.HUB_APPROVED_ORIGINALS_20261120_01 }}
          PART_02: ${{ secrets.HUB_APPROVED_ORIGINALS_20261120_02 }}
          PART_03: ${{ secrets.HUB_APPROVED_ORIGINALS_20261120_03 }}
          PART_04: ${{ secrets.HUB_APPROVED_ORIGINALS_20261120_04 }}
          PART_05: ${{ secrets.HUB_APPROVED_ORIGINALS_20261120_05 }}
          PART_06: ${{ secrets.HUB_APPROVED_ORIGINALS_20261120_06 }}
          PART_07: ${{ secrets.HUB_APPROVED_ORIGINALS_20261120_07 }}
          PART_08: ${{ secrets.HUB_APPROVED_ORIGINALS_20261120_08 }}
          PART_09: ${{ secrets.HUB_APPROVED_ORIGINALS_20261120_09 }}
          PART_10: ${{ secrets.HUB_APPROVED_ORIGINALS_20261120_10 }}
          PART_11: ${{ secrets.HUB_APPROVED_ORIGINALS_20261120_11 }}
          PART_12: ${{ secrets.HUB_APPROVED_ORIGINALS_20261120_12 }}
          PART_13: ${{ secrets.HUB_APPROVED_ORIGINALS_20261120_13 }}
          PART_14: ${{ secrets.HUB_APPROVED_ORIGINALS_20261120_14 }}
          PART_15: ${{ secrets.HUB_APPROVED_ORIGINALS_20261120_15 }}
          PART_16: ${{ secrets.HUB_APPROVED_ORIGINALS_20261120_16 }}
          PART_17: ${{ secrets.HUB_APPROVED_ORIGINALS_20261120_17 }}
          PART_18: ${{ secrets.HUB_APPROVED_ORIGINALS_20261120_18 }}
          PART_19: ${{ secrets.HUB_APPROVED_ORIGINALS_20261120_19 }}
          PART_20: ${{ secrets.HUB_APPROVED_ORIGINALS_20261120_20 }}
          PART_21: ${{ secrets.HUB_APPROVED_ORIGINALS_20261120_21 }}
        run: |
          python3 - <<'PY_PAYLOAD'
          import base64,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'approved-originals';p.mkdir(mode=0o700)
          raw=b''.join(base64.b64decode(os.environ['PART_'+str(i).zfill(2)],validate=True) for i in range(22))
          target=p/'originals.zlib';target.write_bytes(raw);target.chmod(0o600)
          PY_PAYLOAD
      - name: Verify exact manifest bytes without cloud writes
        env:
          ARTICLE_TRANSFER_DRY_RUN: 'true'
        run: python3 scripts/hub-approved-originals-transfer.py ignored "$RUNNER_TEMP/approved-originals/originals.zlib"
      - name: Restore only the fourteen approved existing objects
        if: inputs.apply
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
          ALIYUN_ECS_INSTANCE_ID: ${{ secrets.ALIYUN_ECS_INSTANCE_ID }}
        shell: bash
        run: |
          set -Eeuo pipefail
          export ALIBABA_CLOUD_IGNORE_PROFILE=TRUE
          d="$(mktemp -d)"
          trap 'rm -rf -- "$d" "$RUNNER_TEMP/approved-originals"' EXIT
          curl -fsSL --connect-timeout 15 --max-time 90 https://github.com/aliyun/aliyun-cli/releases/download/v3.3.18/aliyun-cli-linux-3.3.18-amd64.tgz -o "$d/cli.tgz"
          printf '%s  %s\n' 0823286604dbd8beb8d65dd0694d23c913e7c5d5a02b20a3593a4f8a6517f1d4 "$d/cli.tgz" | sha256sum -c -
          tar -xzf "$d/cli.tgz" -C "$d" aliyun
          python3 scripts/hub-approved-originals-transfer.py "$d/aliyun" "$RUNNER_TEMP/approved-originals/originals.zlib"
