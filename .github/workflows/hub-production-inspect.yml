name: Resume sealed ResearchHub release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: researchhub-ecs-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      HUB_RUNTIME_TAG: hub-runtime-33a9ffd3-45155206512001
      HUB_DATABASE_APPROVED_DIGEST: ${{ vars.HUB_DATABASE_APPROVED_DIGEST }}
      OSS_ACCESS_KEY: ${{ secrets.OSS_ACCESS_KEY }}
      OSS_SECRET_KEY: ${{ secrets.OSS_SECRET_KEY }}
      OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
      OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 33a9ffd348aaae75cce1ee5f8cd2cd34a139193c
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify the sealed candidate and current paired baseline
        id: staged
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 33a9ffd348aaae75cce1ee5f8cd2cd34a139193c
          python3 -m pip -q install 'oss2==2.19.1'
          python3 - <<'PYCODE'
          import hashlib, importlib.util, json, os, pathlib
          spec=importlib.util.spec_from_file_location('release','scripts/hub-release.py')
          release=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(release)
          policy=json.loads(pathlib.Path('deploy/release-policy.json').read_text())
          release.validate_core_policy(policy)
          store=release.artifacts.bucket()
          _, previous, pointer=release.read_current(store,policy)
          assert pointer['tag']=='hub-runtime-be32ffdb-45145871325001'
          revision='33a9ffd348aaae75cce1ee5f8cd2cd34a139193c'
          plan=release.plan_module.make_plan(previous,revision,os.environ['HUB_DATABASE_APPROVED_DIGEST'])
          assert plan['releaseRequired'] and not plan['databaseChanged'] and plan['databaseApproved']
          tag=os.environ['HUB_RUNTIME_TAG']
          manifest_sha='85d1a6206ceaf2a1708103f12997c00008ab5ca78842cdb768e1355a427f01ef'
          _, candidate=release.manifest(store,tag,manifest_sha)
          assert candidate['releaseGit']==revision and candidate['databaseDigest']==plan['databaseDigest']
          assert candidate['previousRelease']['manifestSha256']==pointer['manifestSha256']
          assert candidate['previousRelease']['tag']==pointer['tag']
          control_sha='bdb3f76d4f1a580ebd392faabf041271fdf4542d8d921c74adb87374d4d8f637'
          key=f'{release.PREFIX}{tag}/runtime-controls-{control_sha[:16]}/control-manifest.json'
          raw=store.get_object(key).read()
          assert hashlib.sha256(raw).hexdigest()==control_sha
          control=json.loads(raw)
          assert control['paired'] and control['tag']==tag
          assert control['imageManifestSha256']==manifest_sha and control['previousManifestSha256']==pointer['manifestSha256']
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('control_sha='+control_sha+'\n')
          print(json.dumps({'status':'sealed-candidate-verified','releaseGit':revision,'tag':tag,'databaseChanged':False}))
          PYCODE
      - name: Apply both components with paired rollback
        id: apply
        if: steps.staged.outcome == 'success'
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
          ALIYUN_ECS_INSTANCE_ID: ${{ secrets.ALIYUN_ECS_INSTANCE_ID }}
          HUB_RUNTIME_CONTROL_SHA256: ${{ steps.staged.outputs.control_sha }}
          HUB_RUNTIME_ACTION: pair-release
        run: bash scripts/run-hub-runtime-command.sh
      - name: Read-only real browser smoke
        id: browser
        if: steps.apply.outcome == 'success'
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" --ignore-scripts 'playwright@1.63.0'
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
          HUB_PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser/node_modules/playwright/index.mjs" HUB_SMOKE_OUTPUT="$RUNNER_TEMP/hub-browser" node scripts/hub-release-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always() && steps.apply.outcome == 'success'
        with:
          name: public-browser-smoke
          path: ${{ runner.temp }}/hub-browser
          retention-days: 7
      - name: Finalize the successful pair after browser verification
        id: finalize
        if: success() && steps.browser.outcome == 'success'
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
          ALIYUN_ECS_INSTANCE_ID: ${{ secrets.ALIYUN_ECS_INSTANCE_ID }}
          HUB_RUNTIME_CONTROL_SHA256: ${{ steps.staged.outputs.control_sha }}
          HUB_RUNTIME_ACTION: pair-finalize
        run: bash scripts/run-hub-runtime-command.sh
      - name: Restore both previous components if browser verification fails
        if: always() && (failure() || cancelled()) && steps.apply.outcome == 'success' && steps.finalize.outcome == 'skipped'
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
          ALIYUN_ECS_INSTANCE_ID: ${{ secrets.ALIYUN_ECS_INSTANCE_ID }}
          HUB_RUNTIME_CONTROL_SHA256: ${{ steps.staged.outputs.control_sha }}
          HUB_RUNTIME_ACTION: pair-rollback
        run: bash scripts/run-hub-runtime-command.sh
